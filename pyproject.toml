[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pcapng_utils*"]
namespaces = false

[project]
name = "pcapng-utils"
version = "1.1.0"
description = "PCAPNG-to-HAR conversion with masked PII detection reports"
readme = "README.md"
license = {text = "GPL-3.0+ AND MIT"}

requires-python = ">= 3.11"
dependencies = [
  "communityid==1.5.*",
  "presidio-analyzer>=2.2.363,<3.0",
  "sortedcontainers==2.4.*",
  "tyro==1.0.*",
]

authors = [
  {name = "Étienne Maheux (PEReN)", email = "etienne.maheux@peren.gouv.fr"},
  {name = "Esther Onfroy (PEReN)", email = "esther.onfroy@peren.gouv.fr"},
]

maintainers = [
  {name = "U+039b", email = "hello@pts-project.org"}
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[project.scripts]
pcapng_to_har = "pcapng_utils.pcapng_to_har:PcapngToHar.cli"
dump_tshark_layers_as_json = "pcapng_utils.tshark.wrapper:cli_dump_tshark_layers_as_json"
scan_har_pii = "pcapng_utils.pii.cli:main"
scan_pcapng_pii = "pcapng_utils.pii.pipeline_cli:main"

[project.urls]
repository = "https://github.com/zxtssg/pcapng-utils-pii"
issues = "https://github.com/zxtssg/pcapng-utils-pii/issues"
upstream = "https://github.com/PiRogueToolSuite/pcapng-utils"

[dependency-groups]
docs = [
  "autoclasstoc>=1.7",
  "autodoc-pydantic>=2.2",
  "myst-parser",
  "sphinx>=8.1.3",
  "sphinx-autobuild",
  "sphinx-copybutton",
  "sphinx-hoverxref>=1.4.2",
  "sphinx-jsonschema",
  "sphinx-needs",
  "sphinx-notfound-page>=1.0.4",
  "sphinx-pydantic>=0.1.1",
  "sphinx-rtd-theme",
  "sphinx-toolbox",
  "sphinxcontrib-datatemplates>=0.11",
]
